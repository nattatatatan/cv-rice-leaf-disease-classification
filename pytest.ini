[pytest]
testpaths = tests
filterwarnings =
    # matplotlib 3.10.0 (pinned to match Colab) calls camelCase pyparsing APIs that pyparsing 3.3 deprecates.
    # Third-party and harmless; remove when matplotlib is upgraded.
    ignore::DeprecationWarning:matplotlib._fontconfig_pattern
    ignore::DeprecationWarning:matplotlib._mathtext
